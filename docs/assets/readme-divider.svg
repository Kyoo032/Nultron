<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 12" width="880" height="12" role="presentation" aria-hidden="true">
  <defs>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1277C8" stop-opacity="0"/>
      <stop offset="30%" stop-color="#1277C8" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#19BDDC" stop-opacity="1"/>
      <stop offset="70%" stop-color="#6EA4FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#6EA4FF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="divClip">
      <rect x="0" y="4" width="880" height="4" rx="2"/>
    </clipPath>
  </defs>
  <style>
    @keyframes sweep {
      0% { transform: translateX(-440px); }
      100% { transform: translateX(880px); }
    }
    .bar { animation: sweep 3.8s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .bar { animation: none; transform: translateX(220px); }
    }
  </style>
  <rect x="0" y="5" width="880" height="2" rx="1" fill="#1277C8" fill-opacity="0.18"/>
  <g clip-path="url(#divClip)">
    <rect class="bar" x="0" y="4" width="440" height="4" rx="2" fill="url(#divGrad)"/>
  </g>
</svg>
