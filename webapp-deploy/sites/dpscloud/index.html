<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- PLACEHOLDER. This page stands in for the DPS Cloud company website until the real one is ready.
     Replace this whole folder (webapp-deploy/sites/dpscloud, or the folder DPS_WEB_ROOT points at). -->
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --ink: #14213d;
    --muted: #5b6577;
    --line: #dde1e8;
    --accent: #2b59c3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1220;
      --card: #141b2e;
      --ink: #e8ecf5;
      --muted: #9aa6bd;
      --line: #27324b;
      --accent: #7da2ff;
    }
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); color: var(--ink); }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.5;
  }
  main {
    width: 100%;
    max-width: 34rem;
    padding: 40px 32px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
  }
  .mark {
    width: 40px;
    height: 4px;
    margin: 0 0 24px;
    border: 0;
    border-radius: 2px;
    background: var(--accent);
  }
  h1 { margin: 0 0 12px; font-size: 2rem; font-weight: 650; letter-spacing: -0.01em; }
  p { margin: 0 0 8px; color: var(--muted); }
  .lead { color: var(--ink); font-size: 1.125rem; }
  .contact { margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--line); font-size: 0.9375rem; }
  .tag { display: inline-block; margin-top: 20px; font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
</style>
</head>
<body>
<main>
  <hr class="mark">
  <h1>DPS Cloud</h1>
  <p class="lead">Our new website is on its way.</p>
  <p>Please check back soon.</p>
  <p class="contact">Contact: [contact details to be added]</p>
  <span class="tag">Placeholder page</span>
</main>
</body>
</html>
