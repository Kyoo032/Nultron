# Encrypted backup of the app's data volume, without stopping the app. SUSPENDED by default: turn it on
# with `kubectl -n nultron patch cronjob nultron-backup -p '{"spec":{"suspend":false}}'`, or run one
# now with `kubectl -n nultron create job --from=cronjob/nultron-backup backup-now`.
#
# Same recipe as webapp-deploy/scripts/backup.sh (security spec S6), so webapp-deploy/scripts/restore.sh's
# archive layout and cipher still apply:
#   1. init container (the APP image: it has better-sqlite3) -> VACUUM INTO a consistent snapshot;
#   2. main container (an image with node and GNU tar)       -> tar + AES-256-GCM via aead-crypt.mjs (SR-171).
# The data volume is ReadWriteOnce: the pod prefers the app's node, which is the only node that can
# attach it. The archive lands on the nultron-backups volume. Upload to COS is NOT done here.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nultron-backup
  labels:
    app.kubernetes.io/name: nultron-backup
    app.kubernetes.io/part-of: nultron
spec:
  suspend: true
  schedule: "17 * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: nultron-backup
            app.kubernetes.io/part-of: nultron
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          affinity:
            podAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    topologyKey: kubernetes.io/hostname
                    labelSelector:
                      matchLabels:
                        app.kubernetes.io/name: nultron-app
          initContainers:
            - name: snapshot
              image: nultron-ent
              imagePullPolicy: IfNotPresent
              command: ["node", "/scripts/snapshot.mjs"]
              env:
                - {name: AGENTFORGE_DATA_DIR, value: /data}
                - {name: BACKUP_STAGE_DIR, value: /stage}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests: {cpu: 100m, memory: 256Mi}
                limits: {cpu: "1", memory: 1Gi}
              volumeMounts:
                # Read-write on purpose: a WAL-mode reader still opens the -shm file.
                - {name: data, mountPath: /data}
                - {name: stage, mountPath: /stage}
                - {name: scripts, mountPath: /scripts, readOnly: true}
          containers:
            - name: archive
              # Node for aead-crypt.mjs and GNU tar for encrypt.sh's --exclude/-C ordering. The same
              # pin the app image builds from (webapp-deploy/Dockerfile's NODE_VERSION); its base is
              # the Debian slim variant production already archives with inside the app container.
              image: node:22.23.4-bookworm-slim
              imagePullPolicy: IfNotPresent
              command: ["sh", "/scripts/encrypt.sh"]
              env:
                - name: BACKUP_KEY
                  valueFrom:
                    secretKeyRef: {name: nultron-secrets, key: BACKUP_KEY}
                - {name: BACKUP_OUT_DIR, value: /backups}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests: {cpu: 100m, memory: 128Mi}
                limits: {cpu: "1", memory: 512Mi}
              volumeMounts:
                - {name: data, mountPath: /data, readOnly: true}
                - {name: stage, mountPath: /stage, readOnly: true}
                - {name: backups, mountPath: /backups}
                - {name: scripts, mountPath: /scripts, readOnly: true}
          volumes:
            - name: data
              persistentVolumeClaim: {claimName: nultron-data}
            - name: backups
              persistentVolumeClaim: {claimName: nultron-backups}
            - name: stage
              emptyDir: {sizeLimit: 2Gi}
            - name: scripts
              configMap: {name: nultron-backup-scripts}
