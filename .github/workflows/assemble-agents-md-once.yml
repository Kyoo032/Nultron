name: assemble-agents-md-once
on:
  workflow_dispatch:
  push:
    paths:
      - 'tmp/agents-md-chunks/**'
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/agents-md-chat-first-2026-10-06
      - name: Assemble AGENTS.md and clean
        run: |
          set -euo pipefail
          ls tmp/agents-md-chunks/chunk-*.txt | sort | xargs cat > AGENTS.md
          test -s AGENTS.md
          wc -c AGENTS.md
          grep -q 'Product direction (Rizky, 2026-10-06)' AGENTS.md
          rm -rf tmp/agents-md-chunks
          rm -f .github/workflows/assemble-agents-md-once.yml
          git config user.name "Dev Head"
          git config user.email "devhead@users.noreply.github.com"
          git add -A
          git commit -m "docs: Nultron + HYP AI chat-first product direction (2026-10-06)"
          git push origin HEAD:docs/agents-md-chat-first-2026-10-06
